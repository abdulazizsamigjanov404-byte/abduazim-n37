services:
  - type: web
    name: installerbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DOWNLOAD_DIR
        value: downloads
      - key: MAX_FILE_SIZE
        value: "52428800"
